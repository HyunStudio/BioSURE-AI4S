[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosure-ai4s"
version = "0.3.11"
description = "Offline candidate-dependent structural integrity checks"
requires-python = ">=3.12"
dependencies = ["pypdf[fonts]==6.19.0", "fonttools==4.66.1", "pdfplumber==0.11.10"]

[tool.setuptools.packages.find]
include = ["biosure*"]

[tool.setuptools.package-data]
biosure = ["static/*.html", "static/*.css", "static/*.js"]
