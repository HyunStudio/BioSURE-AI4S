name: Standalone release verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest reportlab
      - run: python -m pytest tests -q -p no:cacheprovider
      - run: node --test tests/test_browser_logic.js
      - run: python scripts/verify_reproduction.py .
      - run: python -c "from pathlib import Path; from scripts.prepare_release import verify_manifest; verify_manifest(Path('.')); print('MANIFEST VERIFIED')"
      - run: python scripts/prepare_release.py . "$RUNNER_TEMP/biosure-release"
      - run: python scripts/audit_release.py "$RUNNER_TEMP/biosure-release"
